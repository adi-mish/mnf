[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-normal-forms"
version = "0.1.0"
description = "Research scaffold for Mechanistic Normal Forms: constrained causal abstractions for mechanistic interpretability."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MNF research scaffold"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pandas>=2.0", "scikit-learn>=1.2"]
torch = ["torch>=2.0"]
hf = ["transformers>=4.57,<5"]
transformer-lens = ["transformer-lens>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "unit: fast deterministic unit tests",
  "smoke: integration smoke tests over several components",
  "slow: longer CPU sweeps or integration tests",
  "stochastic: tests that exercise seeded stochastic behavior",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mnf*"]
