name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Smoke demos
        run: |
          python scripts/run_all_demos.py > /tmp/mnf_demo_results.json
          python scripts/run_research_sweeps.py > /tmp/mnf_research_sweeps.json
